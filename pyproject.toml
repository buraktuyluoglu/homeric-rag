[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homeric-rag"
version = "0.1.0"
description = "Entity-aware hybrid retrieval over Homer's Iliad and Odyssey (Samuel Butler prose translations)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Burak Emre Tüylüoğlu" }]
requires-python = ">=3.12"
dependencies = [
    "onnxruntime",
    "transformers",
    "numpy",
    "huggingface_hub",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
homeric-rag = "homeric_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
